apiVersion: v1
kind: Secret
metadata:
  name: nexora-secrets
  namespace: nexora
type: Opaque
stringData:
  # These should be populated from Vault/External Secrets in production
  DATABASE_URL: "postgresql+asyncpg://nexora:CHANGE_ME@postgresql.nexora-database.svc.cluster.local:5432/nexora"
  REDIS_URL: "redis://redis.nexora-database.svc.cluster.local:6379/0"
  SECRET_KEY: "CHANGE_ME_GENERATE_WITH_OPENSSL_RAND_HEX_32"
  OPENAI_API_KEY: ""
  ANTHROPIC_API_KEY: ""
  GOOGLE_API_KEY: ""
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: nexora-config
  namespace: nexora
data:
  ENVIRONMENT: "production"
  DEBUG: "false"
  APP_NAME: "NEXORA"
  APP_VERSION: "0.1.0"
  ACCESS_TOKEN_EXPIRE_MINUTES: "15"
  REFRESH_TOKEN_EXPIRE_DAYS: "7"
  CORS_ORIGINS: '["https://nexora.example.com"]'
  RATE_LIMIT_REQUESTS: "1000"
  RATE_LIMIT_WINDOW: "60"