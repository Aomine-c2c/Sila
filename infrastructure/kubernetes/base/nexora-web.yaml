apiVersion: apps/v1
kind: Deployment
metadata:
  name: nexora-web
  namespace: nexora
  labels:
    app: nexora-web
    version: v1
spec:
  replicas: 3
  selector:
    matchLabels:
      app: nexora-web
  template:
    metadata:
      labels:
        app: nexora-web
        version: v1
    spec:
      serviceAccountName: nexora-web
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        fsGroup: 1001
      containers:
        - name: web
          image: ghcr.io/ORG/nexora-web:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
              name: http
          envFrom:
            - configMapRef:
                name: nexora-web-config
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app
                      operator: In
                      values:
                        - nexora-web
                topologyKey: kubernetes.io/hostname
---
apiVersion: v1
kind: Service
metadata:
  name: nexora-web
  namespace: nexora
  labels:
    app: nexora-web
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: 3000
      protocol: TCP
      name: http
  selector:
    app: nexora-web
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: nexora-web-config
  namespace: nexora
data:
  NEXT_PUBLIC_API_URL: "https://api.nexora.example.com"
  NEXT_PUBLIC_APP_NAME: "NEXORA"
  NEXT_PUBLIC_APP_VERSION: "0.1.0"
  NEXT_PUBLIC_ENABLE_ANALYTICS: "false"
  NEXT_PUBLIC_ENABLE_REALTIME: "true"