apiVersion: v1
kind: ServiceAccount
metadata:
  name: nexora-api
  namespace: nexora
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: nexora-web
  namespace: nexora
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: nexora-api-role
  namespace: nexora
rules:
  - apiGroups: [""]
    resources: ["configmaps", "secrets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: nexora-api-rolebinding
  namespace: nexora
subjects:
  - kind: ServiceAccount
    name: nexora-api
    namespace: nexora
roleRef:
  kind: Role
  name: nexora-api-role
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: nexora-web-role
  namespace: nexora
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: nexora-web-rolebinding
  namespace: nexora
subjects:
  - kind: ServiceAccount
    name: nexora-web
    namespace: nexora
roleRef:
  kind: Role
  name: nexora-web-role
  apiGroup: rbac.authorization.k8s.io