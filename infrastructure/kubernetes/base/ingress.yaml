apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: nexora-api-ingress
  namespace: nexora
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/rate-limit: "100"
    nginx.ingress.kubernetes.io/rate-limit-window: "1m"
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "300"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - api.nexora.example.com
      secretName: nexora-api-tls
  rules:
    - host: api.nexora.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: nexora-api
                port:
                  number: 80
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: nexora-web-ingress
  namespace: nexora
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/rate-limit: "200"
    nginx.ingress.kubernetes.io/rate-limit-window: "1m"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - nexora.example.com
        - www.nexora.example.com
      secretName: nexora-web-tls
  rules:
    - host: nexora.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: nexora-web
                port:
                  number: 80
    - host: www.nexora.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: nexora-web
                port:
                  number: 80