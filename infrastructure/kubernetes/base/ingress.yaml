apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: NEIMAN-api-ingress
  namespace: NEIMAN
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/rate-limit: "100"
    nginx.ingress.kubernetes.io/rate-limit-window: "1m"
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "300"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - api.NEIMAN.example.com
      secretName: NEIMAN-api-tls
  rules:
    - host: api.NEIMAN.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: NEIMAN-api
                port:
                  number: 80
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: NEIMAN-web-ingress
  namespace: NEIMAN
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/rate-limit: "200"
    nginx.ingress.kubernetes.io/rate-limit-window: "1m"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - NEIMAN.example.com
        - www.NEIMAN.example.com
      secretName: NEIMAN-web-tls
  rules:
    - host: NEIMAN.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: NEIMAN-web
                port:
                  number: 80
    - host: www.NEIMAN.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: NEIMAN-web
                port:
                  number: 80