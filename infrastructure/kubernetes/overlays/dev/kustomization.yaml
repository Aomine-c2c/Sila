apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: nexora

resources:
  - ../../base/namespaces.yaml
  - ../../base/config.yaml
  - ../../base/nexora-api.yaml
  - ../../base/nexora-web.yaml
  - ../../base/rbac.yaml

patches:
  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: nexora-api
        namespace: nexora
      spec:
        replicas: 1
        template:
          spec:
            containers:
              - name: api
                resources:
                  requests:
                    cpu: "100m"
                    memory: "128Mi"
                  limits:
                    cpu: "500m"
                    memory: "512Mi"
  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: nexora-web
        namespace: nexora
      spec:
        replicas: 1
        template:
          spec:
            containers:
              - name: web
                resources:
                  requests:
                    cpu: "50m"
                    memory: "64Mi"
                  limits:
                    cpu: "250m"
                    memory: "256Mi"
  - patch: |-
      apiVersion: v1
      kind: Service
      metadata:
        name: nexora-api
        namespace: nexora
      spec:
        type: NodePort
        ports:
          - port: 80
            targetPort: 8000
            nodePort: 30080
  - patch: |-
      apiVersion: v1
      kind: Service
      metadata:
        name: nexora-web
        namespace: nexora
      spec:
        type: NodePort
        ports:
          - port: 80
            targetPort: 3000
            nodePort: 30030

configMapGenerator:
  - name: nexora-config
    behavior: merge
    literals:
      - ENVIRONMENT=development
      - DEBUG=true
      - CORS_ORIGINS='["http://localhost:3000","http://localhost:30030"]'

images:
  - name: ghcr.io/ORG/nexora-api
    newTag: dev
  - name: ghcr.io/ORG/nexora-web
    newTag: dev

commonLabels:
  environment: development
  managed-by: kustomize