apiVersion: external-secrets.io/v1beta1
kind: ClusterSecretStore
metadata:
  name: vault-backend
spec:
  provider:
    vault:
      server: "https://vault.NEIMAN.example.com"
      path: "NEIMAN"
      version: "v2"
      auth:
        kubernetes:
          mountPath: "kubernetes"
          role: "NEIMAN-api"
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: NEIMAN-api-secrets
  namespace: NEIMAN
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: NEIMAN-secrets
    creationPolicy: Owner
  data:
    - secretKey: DATABASE_URL
      remoteRef:
        key: api/database
        property: url
    - secretKey: REDIS_URL
      remoteRef:
        key: api/redis
        property: url
    - secretKey: SECRET_KEY
      remoteRef:
        key: api/auth
        property: secret_key
    - secretKey: OPENAI_API_KEY
      remoteRef:
        key: api/llm
        property: openai_key
    - secretKey: ANTHROPIC_API_KEY
      remoteRef:
        key: api/llm
        property: anthropic_key
    - secretKey: GOOGLE_API_KEY
      remoteRef:
        key: api/llm
        property: google_key
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: NEIMAN-web-secrets
  namespace: NEIMAN
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: NEIMAN-web-secrets
    creationPolicy: Owner
  data:
    - secretKey: NEXT_PUBLIC_ANALYTICS_KEY
      remoteRef:
        key: web/analytics
        property: key