# Default values for NEIMAN-web
replicaCount: 3

image:
  repository: ghcr.io/ORG/NEIMAN-web
  pullPolicy: IfNotPresent
  tag: "latest"

imagePullSecrets:
  - name: ghcr-secret

serviceAccount:
  create: true
  annotations: {}
  name: ""

podAnnotations: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1001
  fsGroup: 1001

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  runAsUser: 1001

service:
  type: ClusterIP
  port: 80
  targetPort: 3000

ingress:
  enabled: true
  className: "nginx"
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/rate-limit: "200"
    nginx.ingress.kubernetes.io/rate-limit-window: "1m"
  hosts:
    - host: NEIMAN.example.com
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: NEIMAN-web-tls
      hosts:
        - NEIMAN.example.com
        - www.NEIMAN.example.com

resources:
  limits:
    cpu: 1000m
    memory: 1Gi
  requests:
    cpu: 250m
    memory: 256Mi

autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 10
  targetCPUUtilizationPercentage: 60
  targetMemoryUtilizationPercentage: 70

livenessProbe:
  httpGet:
    path: /
    port: 3000
  initialDelaySeconds: 10
  periodSeconds: 30
  timeoutSeconds: 10
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /
    port: 3000
  initialDelaySeconds: 5
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3

env:
  - name: NEXT_PUBLIC_API_URL
    value: "https://api.NEIMAN.example.com"
  - name: NEXT_PUBLIC_APP_NAME
    value: "NEIMAN"
  - name: NEXT_PUBLIC_APP_VERSION
    value: "0.1.0"
  - name: NEXT_PUBLIC_ENABLE_ANALYTICS
    value: "false"
  - name: NEXT_PUBLIC_ENABLE_REALTIME
    value: "true"

affinity:
  podAntiAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        podAffinityTerm:
          labelSelector:
            matchExpressions:
              - key: app
                operator: In
                values:
                  - NEIMAN-web
          topologyKey: kubernetes.io/hostname

nodeSelector: {}

tolerations: []

podDisruptionBudget:
  enabled: true
  minAvailable: 1