[package]
name = "app"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
license = ""
repository = ""
edition = "2021"


# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2.7.0", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
dirs = "6.0"
hex = "0.4"
chrono = "0.4"
aes-gcm = "0.10"
rand = "0.8"
sysinfo = "0.33"
tauri = { version = "2.12.0", features = ["tray-icon", "image-png"] }
tauri-plugin-log = "2"
tauri-plugin-updater = "2"

