[package]
name = "neiman-native"
version = "0.1.0"
edition = "2021"

[lib]
name = "neiman_native"
crate-type = ["cdylib", "rlib"]

[dependencies]
engine-rs = { path = "../engine-rs" }
pyo3 = { version = "0.23", features = ["extension-module", "abi3-py310"], optional = true }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
aes-gcm = "0.10"
rand = "0.8"
hex = "0.4"
sha2 = "0.10"

[features]
default = []
python = ["dep:pyo3"]

